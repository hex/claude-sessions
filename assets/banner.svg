<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 614" width="1536" height="614" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="28">
  <defs>
    <clipPath id="type1"><rect x="0" y="-40" width="0" height="60"><animate attributeName="width" from="0" to="270" dur="0.9s" begin="0.6s" fill="freeze" calcMode="discrete" values="0;17;34;51;68;85;102;119;136;153;170;187;204;221;238;255;270" keyTimes="0;0.06;0.12;0.18;0.24;0.3;0.36;0.42;0.48;0.54;0.6;0.66;0.72;0.78;0.84;0.9;1"/></rect></clipPath>
    <clipPath id="type2"><rect x="0" y="-40" width="0" height="60"><animate attributeName="width" from="0" to="760" dur="1.6s" begin="5.2s" fill="freeze"/></rect></clipPath>
    <filter id="soft" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2B2640" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- no page background: the window sits on whatever the README renders on -->

  <!-- the terminal window -->
  <g transform="translate(96,40)">
    <rect width="1344" height="534" rx="18" fill="#F8F5F1" stroke="#E2DECE" stroke-width="2" filter="url(#soft)"/>
    <circle cx="30" cy="28" r="7" fill="#E2DECE"/>
    <circle cx="54" cy="28" r="7" fill="#E2DECE"/>
    <circle cx="78" cy="28" r="7" fill="#E2DECE"/>

    <!-- line 1: the command is typed -->
    <g transform="translate(40,110)">
      <text x="0" y="0" fill="#D97757" font-weight="700">❯</text>
      <g transform="translate(34,0)" clip-path="url(#type1)">
        <text x="0" y="0" fill="#4F4D48">cs debug-api</text>
      </g>
      <rect x="34" y="-24" width="16" height="30" fill="#4F4D48" opacity="0.8">
        <animate attributeName="x" values="34;51;68;85;102;119;136;153;170;187;204;221;238;255;270" keyTimes="0;0.07;0.14;0.21;0.28;0.35;0.42;0.5;0.57;0.64;0.71;0.78;0.85;0.92;1" dur="0.9s" begin="0.6s" fill="freeze" calcMode="discrete"/>
        <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.8" to="0" dur="0.1s" begin="1.9s" fill="freeze"/>
      </rect>
    </g>

    <!-- the launch card cs prints: gradient bars, rust to amber -->
    <g transform="translate(40,178)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.0s" fill="freeze"/>
      <text x="0" y="0" fill="#E64A19" font-weight="700">▌</text>
      <text x="30" y="0" fill="#F57C00" font-weight="700">cs</text>
      <text x="82" y="0" fill="#2E8B57">2026.9.15</text>
    </g>
    <g transform="translate(40,218)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.25s" fill="freeze"/>
      <text x="0" y="0" fill="#F57C00" font-weight="700">▌</text>
      <text x="30" y="0" fill="#2B2640" font-weight="700">debug-api</text>
      <text x="196" y="0" fill="#9A94A8">(↻ resuming)</text>
      <text x="410" y="0" fill="#9A94A8">⌂ studio</text>
    </g>
    <g transform="translate(40,258)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.5s" fill="freeze"/>
      <text x="0" y="0" fill="#FF9800" font-weight="700">▌</text>
      <text x="30" y="0" fill="#B45309">~/.claude-sessions/debug-api</text>
    </g>
    <g transform="translate(40,298)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.75s" fill="freeze"/>
      <text x="0" y="0" fill="#FFB300" font-weight="700">▌</text>
      <text x="30" y="0" fill="#9A94A8">⚿ 1 secret  ·  ctx 24% at last stop</text>
    </g>

    <!-- cs asks the one question it always asks, and gets a y -->
    <g transform="translate(40,350)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.2s" fill="freeze"/>
      <text x="0" y="0" fill="#9A94A8">Continue previous conversation?</text>
      <text x="544" y="0" fill="#4F4D48">[Y/n]</text>
      <text x="644" y="0" fill="#4F4D48" opacity="0">y<animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="4.1s" fill="freeze"/></text>
      <rect x="644" y="-24" width="16" height="30" fill="#4F4D48" opacity="0">
        <animate attributeName="opacity" values="0;0.8;0;0.8;0" keyTimes="0;0.01;0.5;0.51;1" dur="1s" begin="3.2s" repeatCount="1" fill="freeze"/>
      </rect>
    </g>

    <!-- Claude's prompt appears, and the first line of the task is typed -->
    <g transform="translate(40,410)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="4.4s" fill="freeze"/>
      <text x="0" y="0" fill="#D97757" font-size="30">✳<animate attributeName="opacity" values="1;0.55;1" dur="2.4s" begin="5.0s" repeatCount="indefinite"/></text>
      <g transform="translate(40,0)" clip-path="url(#type2)">
        <text x="0" y="0" fill="#4F4D48">where were we with the /orders timeout?</text>
      </g>
    </g>

    <!-- the status bar, pinned at the bottom of the window -->
    <g transform="translate(40,458)" font-size="24" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="4.0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="40 470" to="40 458" dur="0.5s" begin="4.0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.3 1"/>
      <rect x="0" y="0" width="600" height="50" rx="25" fill="#E2DECE"/>
      <text x="26" y="34" fill="#D97757" font-size="26">✳</text>
      <text x="62" y="34" fill="#4F4D48" font-weight="700">debug-api</text>
      <text x="212" y="34" fill="#7C7A71">·</text>
      <text x="242" y="34" fill="#4F4D48" font-weight="700">⎇ main</text>
      <text x="356" y="34" fill="#7C7A71">·</text>
      <text x="386" y="34" fill="#4C1D95" font-weight="700">✦ Fable</text>
      <text x="504" y="34" fill="#5769F7">high</text>

      <g transform="translate(620,0)">
        <rect x="0" y="0" width="180" height="50" rx="25" fill="#E2DECE"/>
        <g fill="#7C7A71">
          <text x="24" y="34">◔<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.33;0.3301;1" dur="9s" begin="4s" repeatCount="indefinite"/></text>
          <text x="24" y="34" opacity="0">◔<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.3301;0.66;0.6601;1" dur="9s" begin="4s" repeatCount="indefinite"/></text>
          <text x="24" y="34" opacity="0" fill="#B45309">◑<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.6601;1" dur="9s" begin="4s" repeatCount="indefinite"/></text>
        </g>
        <text x="58" y="34" fill="#7C7A71">ctx</text>
        <g font-weight="700">
          <text x="108" y="34" fill="#7C7A71">24%<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.33;0.3301;1" dur="9s" begin="4s" repeatCount="indefinite"/></text>
          <text x="108" y="34" fill="#7C7A71" opacity="0">31%<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.3301;0.66;0.6601;1" dur="9s" begin="4s" repeatCount="indefinite"/></text>
          <text x="108" y="34" fill="#B45309" opacity="0">47%<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.6601;1" dur="9s" begin="4s" repeatCount="indefinite"/></text>
        </g>
      </g>

      <g transform="translate(820,0)">
        <rect x="0" y="0" width="304" height="50" rx="25" fill="#E2DECE"/>
        <text x="24" y="34" fill="#7C7A71">◷ 5h</text>
        <text x="90" y="34" fill="#4F4D48" font-weight="700">31%</text>
        <text x="144" y="34" fill="#7C7A71">⋮</text>
        <text x="168" y="34" fill="#7C7A71">◶ wk</text>
        <text x="232" y="34" fill="#B45309" font-weight="700">84%</text>
      </g>
    </g>
  </g>
</svg>
