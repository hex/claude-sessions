# ABOUTME: Runs the bash test suites (macOS + Linux) and the Rust TUI tests on push/PR
# ABOUTME: The release workflow builds binaries only after a green run of this workflow on the tagged commit

name: Test

# Plans, specs and upstream notes under docs/ are the only files no suite reads
# (README, CHANGELOG and the other docs are checked by test_docs and friends),
# so a push that touches nothing else runs no tests.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/superpowers/**'
      - 'docs/upstream/**'
  pull_request:
    paths-ignore:
      - 'docs/superpowers/**'
      - 'docs/upstream/**'

# A newer push to a pull request's branch cancels its older run. Runs on main
# are never cancelled: a release is tagged only on a commit whose own run is
# green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Two jobs per OS, each running half the suites (run_all.sh balances the
  # halves by line count). One macOS job ran all of them for 25 minutes.
  bash:
    name: bash (${{ matrix.os }}, ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Bare runners have no global git identity; cs creates commits when it
      # initializes a session, so the session-lifecycle suites need one.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@claude-sessions.test"
          git config --global user.name "cs CI"

      # age backs cs-secrets sync and jq is a cs requirement. Both are named
      # in CS_TEST_REQUIRE_TOOLS below, so a test that needs one fails on a
      # runner without it instead of skipping and judging nothing.
      - name: Install jq and age (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq age

      - name: Install jq and age (macOS)
        if: runner.os == 'macOS'
        run: brew install jq age

      # The mod suites (test_mod_rotate, test_mod_update, test_mods_layout) run
      # their unit tests under bun, which CS_TEST_REQUIRE_TOOLS below declares,
      # so a runner without it fails them rather than skipping them. The
      # action is pinned by commit and bun by version; unlike shellcheck, no
      # digest checks the bun binary, as setup-bun takes none. The mermaid mod's
      # tests run under claude plugin test and still skip here.
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Show bun version
        run: bun --version

      # CS_TEST_REQUIRE_TOOLS lists what the steps above install (the age
      # package ships age-keygen). tests/test_lib.sh's require_tool fails a
      # test whose listed tool is missing; any other missing tool skips, and
      # run_all.sh names every skip at the end of the log.
      - name: Run bash test suites
        env:
          CS_TEST_SHARD: ${{ matrix.shard }}/2
          CS_TEST_REQUIRE_TOOLS: age age-keygen jq bun
        run: bash tests/run_all.sh

  build-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify the built files are in sync with lib/ and install.sh.in
        run: |
          bash build.sh
          git diff --exit-code bin/cs hooks/cs-shared.sh hooks/cs-config.sh bin/cs-statusline install.sh \
            || { echo "::error::bin/cs, hooks/cs-shared.sh, hooks/cs-config.sh, bin/cs-statusline or install.sh is out of sync with lib/ or install.sh.in. Run ./build.sh and commit all five."; exit 1; }
          git ls-files --error-unmatch hooks/cs-config.sh > /dev/null \
            || { echo "::error::hooks/cs-config.sh is built but not committed. Run ./build.sh and commit it."; exit 1; }

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A linter ships new checks in every release, so an unpinned one reddens
      # main on a commit nobody touched. This job blocks, so the binary is pinned
      # by digest: the tag names a release, only the hash names the bytes.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          sudo tar -xJf shellcheck.tar.xz --strip-components=1 -C /usr/local/bin \
            "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      # Errors fail outright. Warnings are held to the count in
      # .shellcheck-warnings: a rise fails, and so does a fall until the
      # baseline is lowered with it, so the count only ever shrinks.
      # .shellcheckrc declares the shell for the lib/ fragments and excludes
      # the test harness's deliberate subshells.
      - name: Lint shell scripts
        run: bash tests/lint_shell.sh

      # The lint's own tests skip wherever shellcheck is missing; this job
      # installs the pinned one and declares it, so here they fail instead.
      - name: Test the shell lint
        env:
          CS_TEST_REQUIRE_TOOLS: shellcheck
        run: bash tests/test_lint_shell.sh

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Run TUI tests
        run: cargo test --manifest-path tui/Cargo.toml

