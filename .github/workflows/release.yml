# ABOUTME: Builds cs-tui for macOS (arm64, amd64) and Linux (amd64) on version tags
# ABOUTME: Publishes release binaries and their manifest for local SSH signing

name: Release

on:
  push:
    tags:
      - 'v*'

# Only the release job writes (it creates the GitHub Release); the build job
# checks out and uploads artifacts, which needs no write access to contents.
permissions:
  contents: read

jobs:
  # The release skill tags only a commit whose own Test run is green, but a
  # tag pushed by hand would build and publish untested. This job makes the
  # rule hold for every tag: it fails unless the Test workflow's push run on
  # main completed with success for exactly the tagged commit. A commit that
  # never reached main has no such run (a pull_request run on the same sha
  # tested the PR's merge commit, not this one; test.yml also skips a push
  # that only touches docs/superpowers or docs/upstream) and fails here too; a
  # run still in progress fails the same way, naming its status, so tag after
  # Test finishes.
  ci-green:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a green Test run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a push run on main tested this exact commit: a pull_request run
          # carries the PR head's sha but tested the merge commit, so it does not
          # count. Zero runs prints an empty line.
          found=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml \
            --commit "$GITHUB_SHA" --event push --branch main --limit 1 \
            --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"')
          if [ "$found" != 'completed success' ]; then
            echo "::error::Test is '${found:-no run}' (status conclusion) for $GITHUB_SHA; a release needs a green Test run on the tagged commit"
            exit 1
          fi

  build:
    needs: ci-green
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - platform: darwin-amd64
            runner: macos-15-large
            target: x86_64-apple-darwin
            ext: ""
          - platform: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, whose action.yml defaults toolchain to stable
        with:
          targets: ${{ matrix.target }}

      - name: Build cs-tui
        run: cargo build --release --manifest-path tui/Cargo.toml --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "tui/target/${{ matrix.target }}/release/cs-tui${{ matrix.ext }}" "cs-tui-${{ matrix.platform }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cs-tui-${{ matrix.platform }}
          path: cs-tui-${{ matrix.platform }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          merge-multiple: true

      # The published install.sh carries the sha256s of this tag's payload
      # files, so with no CS_INSTALL_REF it must fetch them from this tag, not
      # main. Done before signing and checksumming, which then cover it.
      - name: Pin the installer's default payload ref to the tag
        run: |
          sed -i "s|^CS_DEFAULT_REF=main\$|CS_DEFAULT_REF=${GITHUB_REF_NAME}|" install.sh
          grep -qx "CS_DEFAULT_REF=${GITHUB_REF_NAME}" install.sh

      - name: Generate manifest
        run: |
          export LC_ALL=C
          sha256sum install.sh cs-tui-* > SHA256SUMS

      - name: Generate checksums
        run: |
          sha256sum install.sh > install.sh.sha256
          for bin in cs-tui-*; do
            sha256sum "$bin" > "${bin}.sha256"
          done

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            install.sh
            install.sh.sha256
            cs-tui-*
            SHA256SUMS
          generate_release_notes: true
          # A file pattern that matches nothing fails the release instead of
          # publishing it without that asset.
          fail_on_unmatched_files: true
          # Created as a draft, so no one sees a release whose uploads have not
          # all landed; the next step publishes it.
          draft: true
          # A hyphenated tag (v1.2.3-rc1, v0.0.0-smoke) is a pre-release: it must
          # never become the repo's Latest, which is what installers resolve.
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
